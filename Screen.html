<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Khắc Nhập Khắc Xuất - Screen</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            font-weight: bold !important;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000040;
            background-image: url('bg1.png');
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        .game-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transform: scale(1.5);
            transform-origin: center center;
        }

        .prize-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 660px;
            height: 85px;
            gap: 15px;
        }

        .sign-img {
            height: 85px;
            width: 85px;
            object-fit: contain;
            display: none;
            z-index: 1;
        }

        .prize-container.has-signs .sign-img {
            display: block;
        }

        .prize-container.has-signs #leftSignImg {
            animation: signSlideLeft 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .prize-container.has-signs #rightSignImg {
            animation: signSlideRight 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .main-prize {
            position: relative;
            z-index: 2;
            background-color: #ffd700;
            background-image: url('YellowStrap.png');
            background-size: 100% 100%;
            height: 85px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 42px;
            box-sizing: border-box;
            transform-origin: center center !important;
            will-change: transform, width;
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 8px;
        }

        .main-prize[data-anim="active"] {
            animation: moneyCloseOpen 0.6s linear forwards;
        }

        .prize-container.has-signs .main-prize {
            width: 460px;
            animation: stretch460 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .prize-container:not(.has-signs) .main-prize {
            width: 660px;
        }

        .symbols-row {
            display: flex;
            width: 660px;
            gap: 4px;
            margin-bottom: 5px;
        }

        .symbol-box {
            background-color: #e0e0e0;
            background-image: url('SymbolStrap.png');
            background-size: 100% 100%;
            flex: 1;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: #000;
            border-radius: 6px;
        }

        .game-board.round-2-mode .symbol-box {
            line-height: 1;
        }

        .symbol-box.selected {
            background-color: #ff9900;
            background-image: url('SymbolChooseStrap.png') !important;
        }

        .symbol-box.closed {
            background-color: #555;
            background-image: url('SymbolCloseStrap.png') !important;
            color: transparent !important;
        }

        .bottom-area {
            position: relative;
            width: 660px;
            height: 400px;
        }

        .money-grid {
            display: grid;
            grid-template-columns: repeat(2, 325px);
            grid-gap: 8px 10px;
            grid-auto-flow: column;
            grid-template-rows: repeat(6, 60px);
            width: 100%;
            height: 100%;
        }

        .money-box {
            background-color: #ffd700;
            background-image: url('YellowStrap.png');
            background-size: 100% 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 26px;
            border-radius: 6px;
        }

        .money-box.selected {
            background-color: #ff9900;
            background-image: url('ChooseStrap.png') !important;
        }

        .money-box.closed {
            background-color: #555;
            background-image: url('CloseStrap.png') !important;
            color: transparent !important;
        }

        .game-board.hide-money #moneyGrid {
            display: none !important;
        }

        .topic-container {
            display: none;
            background-color: #ffd700;
            background-image: url('YellowStrap.png');
            background-size: 100% 100%;
            width: 660px;
            height: 65px;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            transform: scaleX(0);
            transform-origin: center;
            border-radius: 8px;
        }

        .topic-text {
            color: #000;
            font-size: 28px;
            opacity: 0;
            text-align: center;
        }

        .choices-column {
            display: none;
            flex-direction: column;
            gap: 12px;
            position: absolute;
            top: 77px;
            left: 0;
            z-index: 10;
        }

        .choice-box {
            background-color: #fff;
            background-image: url('sss.png');
            background-size: 100% 100%;
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scaleX(0);
            transform-origin: center;
            border-radius: 8px;
        }

        .choice-box.used {
            background-color: #888;
            background-image: url('bbb.png') !important;
        }

        .choice-text {
            color: #000;
            font-size: 44px;
            opacity: 0;
        }

        .game-board.show-topic .topic-container {
            display: flex;
            animation: stretchAcross 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .game-board.show-topic .topic-text {
            animation: fadeInText 0.2s ease-in-out 0.3s forwards;
        }

        .game-board.show-choices .choices-column {
            display: flex;
        }

        .game-board.show-choices .choice-box {
            animation: stretchAcross 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .game-board.show-choices .choice-text {
            animation: fadeInText 0.2s ease-in-out forwards;
        }

        .game-board.show-choices #choiceA { animation-delay: 0s; }
        .game-board.show-choices #choiceB { animation-delay: 0.25s; }
        .game-board.show-choices #choiceC { animation-delay: 0.5s; }

        .game-board.show-choices #choiceA .choice-text { animation-delay: 0.3s; }
        .game-board.show-choices #choiceB .choice-text { animation-delay: 0.55s; }
        .game-board.show-choices #choiceC .choice-text { animation-delay: 0.8s; }

        .question-area {
            display: none;
            position: absolute;
            top: 77px;
            left: 85px;
            width: 575px;
            height: 249px;
        }

        .question-box {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            background-size: 100% 100%;
            display: flex;
            align-items: center;
            padding: 20px 145px 20px 30px;
            box-sizing: border-box;
            transform: scaleX(0);
            transform-origin: left center;
            border-radius: 12px;
            border: 3px solid #ffd700;
            overflow-y: auto;
        }

        .game-board.round-2-mode .question-box {
            padding: 20px 30px !important;
        }

        .question-content {
            color: #000;
            font-size: 22px;
            line-height: 1.4;
            opacity: 0;
            width: 100%;
        }

        .question-content img, .question-content video {
            max-width: 100%;
            max-height: 170px;
            object-fit: contain;
            border-radius: 6px;
            display: block;
            margin: 6px auto;
        }

        .answer-buttons {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
        }

        .game-board.round-2-mode .answer-buttons {
            display: none !important;
        }

        .ans-btn {
            background-color: #fff;
            background-image: url('sss.png');
            background-size: 100% 100%;
            width: 100px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 24px;
            border-radius: 8px;
        }

        .ans-btn.chosen {
            background-color: #333;
            background-image: url('true false choose strap.png') !important;
            color: #fff !important;
        }

        .ans-btn.correct-final {
            background-color: #00aa00;
            background-image: url('truefalseright strap.png') !important;
            color: #fff !important;
        }

        .ans-btn.wrong-final {
            background-color: #cc0000;
            background-image: url('truefalsewrongstrap.png') !important;
            color: #fff !important;
        }

        .ans-btn.hidden-ans {
            opacity: 0 !important;
        }

        .game-board.show-question .question-area {
            display: block;
        }

        .game-board.show-question .question-box {
            animation: stretchAcross 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .game-board.show-question .question-content {
            animation: fadeInText 0.3s ease-in-out 0.4s forwards;
        }

        .game-board.show-question .answer-buttons {
            animation: fadeInText 0.3s ease-in-out 0.7s forwards;
        }

        .round2-answer-container {
            display: none;
            position: absolute;
            top: 159px;
            width: 660px;
            height: 98px;
        }

        .round2-answer-box {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            background-size: 100% 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scaleX(0);
            transform-origin: center;
            border-radius: 10px;
            border: 3px solid #ffd700;
            padding: 8px;
        }

        .round2-answer-text {
            color: #000;
            font-size: 32px;
            text-align: center;
            opacity: 0;
            text-transform: uppercase;
            width: 100%;
        }

        .round2-answer-text img, .round2-answer-text video {
            max-width: 100%;
            max-height: 80px;
            object-fit: contain;
            border-radius: 6px;
        }

        .game-board.round-2-mode.show-r2-ans .question-area {
            display: block;
        }

        .game-board.round-2-mode.show-r2-ans .question-box {
            animation: shrinkLeft 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .game-board.round-2-mode.show-r2-ans .question-content {
            opacity: 0;
            transition: opacity 0.1s;
        }

        .game-board.round-2-mode.show-r2-ans .choices-column {
            display: none !important;
        }

        .game-board.round-2-mode.show-r2-ans .round2-answer-container {
            display: block;
        }

        .game-board.round-2-mode.show-r2-ans .round2-answer-box {
            animation: stretchFromCenter 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.3s forwards;
        }

        .game-board.round-2-mode.show-r2-ans .round2-answer-text {
            animation: fadeInText 0.15s ease-in-out 0.6s forwards;
        }

        .game-board.round-2-mode.play-close .question-area {
            display: none;
        }

        .game-board.round-2-mode.play-close .round2-answer-container {
            display: block;
        }

        .game-board.round-2-mode.play-close .round2-answer-box {
            animation: shrinkToCenter 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
        }

        .game-board.round-2-mode.play-close .round2-answer-text {
            opacity: 0 !important;
        }

        .game-board.round-2-mode.show-r2-result .question-area {
            display: none;
        }

        .game-board.round-2-mode.show-r2-result .choices-column {
            display: none !important;
        }

        .game-board.round-2-mode.show-r2-result .round2-answer-container {
            display: block;
        }

        .game-board.round-2-mode.show-r2-result .round2-answer-box {
            animation: stretchFromCenter 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .game-board.round-2-mode.show-r2-result .round2-answer-text {
            animation: fadeInText 0.15s ease-in-out 0.3s forwards;
        }

        .mhc-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,64,0.9);
            background-image: url('MHC.png');
            background-size: cover;
            background-position: center;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .money-box-animate {
            opacity: 0;
            animation: fadeInUpMoney 0.1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes moneyCloseOpen {
            0% { transform: scaleX(1); }
            50% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }

        @keyframes signSlideLeft {
            0% { transform: translateX(100px) scale(0.5); opacity: 0; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }

        @keyframes signSlideRight {
            0% { transform: translateX(-100px) scale(0.5); opacity: 0; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }

        @keyframes stretchAcross {
            0% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }

        @keyframes fadeInText {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes shrinkLeft {
            0% { transform: scaleX(1); opacity: 1; }
            100% { transform: scaleX(0); opacity: 0; }
        }

        @keyframes stretchFromCenter {
            0% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }

        @keyframes shrinkToCenter {
            0% { transform: scaleX(1); }
            100% { transform: scaleX(0); }
        }

        @keyframes fadeInUpMoney {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes stretch460 {
            0% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }
    </style>
</head>

<body>
    <div id="mhcOverlay" class="mhc-overlay"></div>
    <div class="game-board hide-money" id="gameBoard">
        <div class="prize-container" id="prizeContainer">
            <img src="daucong.png" id="leftSignImg" class="sign-img">
            <div class="main-prize" id="totalPrize">0 $A</div>
            <img src="daucong.png" id="rightSignImg" class="sign-img">
        </div>
        <div class="symbols-row" id="symbolsRow"></div>

        <div class="bottom-area">
            <div class="money-grid" id="moneyGrid"></div>
            <div class="topic-container" id="topicContainer">
                <div class="topic-text" id="topicText">TỪ CHỦ ĐỀ 1</div>
            </div>
            <div class="choices-column" id="choicesColumn">
                <div class="choice-box" id="choiceA">
                    <div class="choice-text">A</div>
                </div>
                <div class="choice-box" id="choiceB">
                    <div class="choice-text">B</div>
                </div>
                <div class="choice-box" id="choiceC">
                    <div class="choice-text">C</div>
                </div>
            </div>
            <div class="question-area" id="questionArea">
                <div class="question-box" id="questionBox">
                    <div class="question-content" id="questionContent">Nội dung câu hỏi...</div>
                </div>
                <div class="answer-buttons" id="answerButtons">
                    <div class="ans-btn" id="trueBtn">ĐÚNG</div>
                    <div class="ans-btn" id="falseBtn">SAI</div>
                </div>
            </div>
            <div class="round2-answer-container" id="round2AnswerContainer">
                <div class="round2-answer-box" id="round2AnswerBox">
                    <div class="round2-answer-text" id="round2AnswerText">ĐÁP ÁN</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // --- Client Crypto System ---
        let clientKeyPair = null;
        let serverPublicKeyObj = null;

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        function base64ToBuffer(base64) {
            const binaryString = window.atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        async function initClientCrypto() {
            clientKeyPair = await window.crypto.subtle.generateKey(
                {
                    name: "RSA-OAEP",
                    modulusLength: 2048,
                    publicExponent: new Uint8Array([1, 0, 1]),
                    hash: "SHA-256"
                },
                true,
                ["encrypt", "decrypt"]
            );
            const jwk = await window.crypto.subtle.exportKey("jwk", clientKeyPair.publicKey);
            return jwk;
        }

        async function setServerPublicKey(serverJwk) {
            const cleanJwk = {
                kty: serverJwk.kty,
                n: serverJwk.n,
                e: serverJwk.e,
                alg: "RSA-OAEP-256",
                ext: true
            };
            serverPublicKeyObj = await window.crypto.subtle.importKey(
                "jwk",
                cleanJwk,
                { name: "RSA-OAEP", hash: "SHA-256" },
                false,
                ["encrypt"]
            );
        }

        async function encryptDataForServer(dataObj) {
            if (!serverPublicKeyObj) return dataObj;
            try {
                const rawAesKey = window.crypto.getRandomValues(new Uint8Array(32));
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const jsonStr = JSON.stringify(dataObj);
                const encText = new TextEncoder().encode(jsonStr);

                const aesKey = await window.crypto.subtle.importKey(
                    "raw",
                    rawAesKey,
                    { name: "AES-GCM" },
                    false,
                    ["encrypt"]
                );

                const cipherBuffer = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    aesKey,
                    encText
                );

                const cipherArray = new Uint8Array(cipherBuffer);
                const tagLength = 16;
                const dataBytes = cipherArray.slice(0, cipherArray.length - tagLength);
                const tagBytes = cipherArray.slice(cipherArray.length - tagLength);

                const ciphertextBase64 = arrayBufferToBase64(dataBytes.buffer);
                const tagBase64 = arrayBufferToBase64(tagBytes.buffer);
                const fullCiphertext = ciphertextBase64 + ':' + tagBase64;

                const encryptedKeyBuf = await window.crypto.subtle.encrypt(
                    { name: "RSA-OAEP" },
                    serverPublicKeyObj,
                    rawAesKey.buffer
                );

                return {
                    k: arrayBufferToBase64(encryptedKeyBuf),
                    i: arrayBufferToBase64(iv.buffer),
                    d: fullCiphertext
                };
            } catch (err) {
                console.error("Client encryption error:", err);
                return dataObj;
            }
        }

        async function decryptDataFromServer(pkg) {
            if (!pkg || typeof pkg !== 'object' || !pkg.k || !pkg.i || !pkg.d || !clientKeyPair) {
                return pkg;
            }
            try {
                const encryptedKeyBuf = base64ToBuffer(pkg.k);
                const aesKeyRaw = await window.crypto.subtle.decrypt(
                    { name: "RSA-OAEP" },
                    clientKeyPair.privateKey,
                    encryptedKeyBuf
                );

                const aesKey = await window.crypto.subtle.importKey(
                    "raw",
                    aesKeyRaw,
                    { name: "AES-GCM" },
                    false,
                    ["decrypt"]
                );

                const parts = pkg.d.split(':');
                const dataBytes = new Uint8Array(base64ToBuffer(parts[0]));
                const tagBytes = new Uint8Array(base64ToBuffer(parts[1]));

                const combined = new Uint8Array(dataBytes.length + tagBytes.length);
                combined.set(dataBytes, 0);
                combined.set(tagBytes, dataBytes.length);

                const ivBuf = base64ToBuffer(pkg.i);

                const decryptedBuf = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: ivBuf },
                    aesKey,
                    combined.buffer
                );

                const decStr = new TextDecoder().decode(decryptedBuf);
                return JSON.parse(decStr);
            } catch (err) {
                console.error("Client decryption error:", err);
                return pkg;
            }
        }

        socket.on('connect', async () => {
            const jwk = await initClientCrypto();
            socket.emit('register-client-key', { jwk });
        });

        socket.on('init-handshake', async (data) => {
            if (data && data.jwk) {
                await setServerPublicKey(data.jwk);
            }
        });

        let audioUnlocked = false;
        function unlockAudio() {
            if (audioUnlocked) return;
            const dummy = new Audio();
            dummy.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
            dummy.play().then(() => {
                audioUnlocked = true;
                document.removeEventListener('click', unlockAudio);
                document.removeEventListener('keydown', unlockAudio);
            }).catch(() => { });
        }
        document.addEventListener('click', unlockAudio);
        document.addEventListener('keydown', unlockAudio);

        const SHORT_SOUNDS = ['reveal_amount.mp3', 'round_start.mp3', 'theme_short.mp3', 'ding.mp3', 'value_increase.mp3', 'value_decrease.mp3'];
        const audioCache = {};
        let currentBackgroundMusic = null;

        SHORT_SOUNDS.forEach(soundName => {
            const audio = new Audio(soundName);
            audio.preload = 'auto';
            audioCache[soundName] = audio;
        });

        socket.on('play-sound-client', async (rawPayload) => {
            const data = await decryptDataFromServer(rawPayload);
            if (!data || !data.sound) return;
            const soundName = data.sound;
            if (audioCache[soundName]) {
                const cloneSound = audioCache[soundName].cloneNode();
                cloneSound.volume = 1;
                cloneSound.play().catch(err => { });
            } else {
                if (currentBackgroundMusic) currentBackgroundMusic.pause();
                currentBackgroundMusic = new Audio(soundName);
                currentBackgroundMusic.play().catch(err => { });
            }
        });

        socket.on('stop-all-sounds-client', async (rawPayload) => {
            await decryptDataFromServer(rawPayload);
            if (currentBackgroundMusic) {
                currentBackgroundMusic.pause();
                currentBackgroundMusic.currentTime = 0;
            }
            SHORT_SOUNDS.forEach(soundName => {
                if (audioCache[soundName]) {
                    audioCache[soundName].pause();
                    audioCache[soundName].currentTime = 0;
                }
            });
        });

        socket.on('display-popup', async (rawPayload) => {
            const msg = await decryptDataFromServer(rawPayload);
            if (msg) alert(msg);
        });

        let wasHiddenBefore = true;
        let activeDingIndexes = new Set();
        let currentRenderSession = 0;
        let isAnimatingMoney = false;

        function parseMediaContent(rawText) {
            if (!rawText) return { text: '', mediaType: null, mediaUrl: '' };
            let str = String(rawText).trim();
            const urlRegex = /(https?:\/\/[^\s]+)/gi;
            const matches = str.match(urlRegex);
            
            if (!matches || matches.length === 0) {
                return { text: str, mediaType: null, mediaUrl: '' };
            }
            
            let rawUrl = matches[0];
            let cleanText = str.replace(rawUrl, '').trim();
            let lowerUrl = rawUrl.toLowerCase();
            let mediaType = null;
            let mediaUrl = rawUrl;
            
            if (lowerUrl.includes('imgur.com') && lowerUrl.endsWith('.gifv')) {
                mediaUrl = rawUrl.replace(/\.gifv$/i, '.mp4');
                mediaType = 'video';
            } else if (/\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i.test(lowerUrl) || lowerUrl.includes('v.imgur.com')) {
                mediaType = 'video';
            } else if (/\.(mp3|wav|ogg|m4a|aac|flac)(\?.*)?$/i.test(lowerUrl)) {
                mediaType = 'audio';
            } else if (/\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?.*)?$/i.test(lowerUrl)) {
                mediaType = 'image';
            } else if (lowerUrl.includes('imgur.com')) {
                let match = rawUrl.match(/imgur\.com\/(?:a\/|gallery\/)?([a-zA-Z0-9]+)/);
                if (match && match[1]) {
                    mediaUrl = `https://i.imgur.com/${match[1]}.png`;
                    mediaType = 'image';
                } else {
                    mediaType = 'image';
                }
            } else {
                mediaType = 'image';
            }
            
            return {
                text: cleanText,
                mediaType: mediaType,
                mediaUrl: mediaUrl,
                rawUrl: rawUrl
            };
        }

        function renderQuestionHTML(elementId, rawText) {
            const el = document.getElementById(elementId);
            if (!el) return;
            if (!rawText) {
                el.innerHTML = '';
                return;
            }
            const parsed = parseMediaContent(rawText);
            let html = '';
            if (parsed.text) {
                html += `<div style="margin-bottom: 6px;">${parsed.text}</div>`;
            }
            if (parsed.mediaType === 'image') {
                html += `<div style="display:flex; justify-content:center; width:100%;"><img src="${parsed.mediaUrl}" alt="Media" style="max-width:100%; max-height:160px; object-fit:contain; border-radius:6px;" onerror="if(this.src!=='${parsed.rawUrl}') this.src='${parsed.rawUrl}';" /></div>`;
            } else if (parsed.mediaType === 'video') {
                html += `<div style="display:flex; justify-content:center; width:100%;"><video src="${parsed.mediaUrl}" controls autoplay loop style="max-width:100%; max-height:160px; border-radius:6px;"></video></div>`;
            } else if (parsed.mediaType === 'audio') {
                html += `<div style="width:100%; margin-top:6px;"><audio src="${parsed.mediaUrl}" controls autoplay style="width:100%; height:40px;"></audio></div>`;
            }
            el.innerHTML = html;
        }

        socket.on('sync-full-state', async (rawPayload) => {
            const state = await decryptDataFromServer(rawPayload);
            if (!state) return;

            // 1. MHC Overlay
            const mhc = document.getElementById('mhcOverlay');
            if (mhc) mhc.style.display = (state.showMHC === undefined || state.showMHC === true) ? 'flex' : 'none';

            // 2. Class Board
            const board = document.getElementById('gameBoard');
            board.className = "game-board";
            if (state.currentActiveRound === 2) board.classList.add('round-2-mode');
            if (state.displayClasses) state.displayClasses.forEach(cls => board.classList.add(cls));

            // 3. Side signs
            const container = document.getElementById('prizeContainer');
            const leftImg = document.getElementById('leftSignImg');
            const rightImg = document.getElementById('rightSignImg');

            if (state.activeSideSign) {
                leftImg.src = state.activeSideSign;
                rightImg.src = state.activeSideSign;
                container.classList.add('has-signs');
            } else {
                container.classList.remove('has-signs');
            }

            // 4. Money Animation
            let mainPrizeBox = document.querySelector('.main-prize');
            let totalPrizeEl = document.getElementById('totalPrize');
            const hasAnimationTrigger = (state.lastAction === 'moneyAnim_increase' || state.lastAction === 'moneyAnim_decrease');

            if (hasAnimationTrigger && !isAnimatingMoney) {
                isAnimatingMoney = true;
                const currentAnimType = state.lastAction;
                encryptDataForServer({}).then(enc => socket.emit('consume-action', enc));

                const soundName = currentAnimType === 'moneyAnim_increase' ? 'value_increase.mp3' : 'value_decrease.mp3';
                if (audioCache[soundName]) {
                    const cloneSound = audioCache[soundName].cloneNode();
                    cloneSound.volume = 1;
                    cloneSound.play().catch(e => { });
                }

                mainPrizeBox.style.animation = 'none';
                mainPrizeBox.offsetHeight;
                mainPrizeBox.style.animation = 'moneyCloseOpen 0.6s linear forwards';

                setTimeout(() => {
                    if (totalPrizeEl) {
                        totalPrizeEl.innerText = state.globalTotalPrize.toLocaleString('vi-VN') + " $A";
                    }
                }, 300);

                setTimeout(() => {
                    mainPrizeBox.style.animation = '';
                    isAnimatingMoney = false;
                }, 600);

            } else {
                if (!isAnimatingMoney) {
                    if (totalPrizeEl) {
                        totalPrizeEl.innerText = state.globalTotalPrize.toLocaleString('vi-VN') + " $A";
                    }
                }
            }

            // 5. Grid logic animation
            const isCurrentlyHidden = state.displayClasses && state.displayClasses.includes('hide-money');
            let shouldAnimateGrid = false;

            if (wasHiddenBefore && !isCurrentlyHidden) {
                shouldAnimateGrid = true;
                activeDingIndexes.clear();
                currentRenderSession++;
            }
            wasHiddenBefore = isCurrentlyHidden;

            // 6. Draw Grid
            const grid = document.getElementById('moneyGrid');
            grid.innerHTML = '';
            const layout = state.currentActiveRound === 1 ? state.currentMoneyLayoutV1 : state.currentMoneyLayoutV2;
            const currentGridState = state.currentActiveRound === 1 ? state.moneyGridStateV1 : state.moneyGridStateV2;
            const thisSession = currentRenderSession;

            layout.forEach((val, idx) => {
                const box = document.createElement('div');
                box.className = 'money-box';
                box.innerText = val;
                if (currentGridState[idx] === 'selected') box.classList.add('selected');
                if (currentGridState[idx] === 'closed') box.classList.add('closed');

                if (shouldAnimateGrid) {
                    box.classList.add('money-box-animate');
                    box.style.animationDelay = `${idx * 0.12}s`;

                    box.addEventListener('animationstart', () => {
                        if (thisSession === currentRenderSession && !activeDingIndexes.has(idx)) {
                            activeDingIndexes.add(idx);
                            if (audioCache['ding.mp3']) {
                                const cloneDing = audioCache['ding.mp3'].cloneNode();
                                cloneDing.volume = 1;
                                cloneDing.play().catch(e => { });
                            }
                        }
                    });
                }
                grid.appendChild(box);
            });

            // 7. Symbols Row
            const sRow = document.getElementById('symbolsRow');
            sRow.innerHTML = '';
            const displaySigns = state.currentActiveRound === 1 ? ['+', '+', '+', '+', '-', '-', '-', '-'] : ['×', '×', '×', '×', '÷', '÷', '÷', '÷'];
            const currentSymbolState = state.currentActiveRound === 1 ? state.symbolBoxesStateV1 : state.symbolBoxesStateV2;

            displaySigns.forEach((sign, idx) => {
                const box = document.createElement('div');
                box.className = 'symbol-box';
                box.innerHTML = `<span>${sign}</span>`;
                if (currentSymbolState[idx] === 'selected') box.classList.add('selected');
                if (currentSymbolState[idx] === 'closed') box.classList.add('closed');
                sRow.appendChild(box);
            });

            // 8. Texts & Topics
            if (state.currentRoundData && state.currentRoundData.topic) {
                document.getElementById('topicText').innerText = state.currentRoundData.topic;
            } else {
                document.getElementById('topicText').innerText = '';
            }

            ['A', 'B', 'C'].forEach(ch => {
                const cBox = document.getElementById(`choice${ch}`);
                if (cBox) {
                    if (state.usedChoices && state.usedChoices[ch]) cBox.classList.add('used');
                    else cBox.classList.remove('used');
                }
            });

            if (state.activeQuestion && state.currentRoundData && state.currentRoundData[state.activeQuestion]) {
                renderQuestionHTML('questionContent', state.currentRoundData[state.activeQuestion].text);
                document.getElementById('questionBox').style.backgroundImage = `url('box${state.activeQuestion}.png')`;
                if (state.round1CtrlState) {
                    document.getElementById('trueBtn').className = state.round1CtrlState.trueBtnClass || 'ans-btn';
                    document.getElementById('falseBtn').className = state.round1CtrlState.falseBtnClass || 'ans-btn';
                }
            } else {
                document.getElementById('questionContent').innerText = '';
            }

            const r2Box = document.getElementById('round2AnswerBox');
            if (r2Box && state.round2CtrlState) {
                r2Box.style.backgroundImage = state.round2CtrlState.backgroundImage || "url('Whitebar2.png')";
                renderQuestionHTML('round2AnswerText', state.round2CtrlState.text || '');
                const txtEl = document.getElementById('round2AnswerText');
                if (txtEl) txtEl.style.color = state.round2CtrlState.textColor || '#000000';
            }
        });
    </script>
</body>
