<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Khắc Nhập Khắc Xuất - Screen</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            font-weight: bold !important;
            user-select: none;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #0d1b2a;
            background-image: url('bg1.png');
            background-size: cover;
            background-position: center;
        }

        .game-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Arial', sans-serif;
            gap: 10px;
            transform: scale(1.5);
            transform-origin: center center;
        }

        .prize-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 660px;
            height: 85px;
            gap: 15px;
        }

        .sign-img {
            height: 85px;
            width: 85px;
            object-fit: contain;
            display: none;
            z-index: 1;
        }

        .prize-container.has-signs .sign-img {
            display: block;
        }

        .prize-container.has-signs #leftSignImg {
            animation: signSlideLeft 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .prize-container.has-signs #rightSignImg {
            animation: signSlideRight 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .main-prize {
            position: relative;
            z-index: 2;
            background-color: #ffd700;
            background-image: url('YellowStrap.png');
            background-size: 100% 100%;
            height: 85px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 42px;
            box-sizing: border-box;
            transform-origin: center center !important;
            will-change: transform, width;
            border-radius: 8px;
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .main-prize[data-anim="active"] {
            animation: moneyCloseOpen 0.6s linear forwards;
        }

        .prize-container.has-signs .main-prize {
            width: 460px;
            animation: stretch460 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes moneyCloseOpen {
            0% {
                transform: scaleX(1);
            }

            50% {
                transform: scaleX(0);
            }

            100% {
                transform: scaleX(1);
            }
        }

        .prize-container.has-signs .main-prize {
            width: 460px;
        }

        .prize-container:not(.has-signs) .main-prize {
            width: 660px;
        }

        .symbols-row {
            display: flex;
            width: 660px;
            gap: 4px;
            margin-bottom: 5px;
        }

        .symbol-box {
            background-color: #f0f0f0;
            background-image: url('SymbolStrap.png');
            background-size: 100% 100%;
            flex: 1;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: #000;
            border-radius: 6px;
        }

        .game-board.round-2-mode .symbol-box {
            line-height: 1;
        }

        .symbol-box.selected {
            background-color: #ff9900;
            background-image: url('SymbolChooseStrap.png') !important;
        }

        .symbol-box.closed {
            background-color: #444;
            background-image: url('SymbolCloseStrap.png') !important;
            color: transparent !important;
        }

        .bottom-area {
            position: relative;
            width: 660px;
            height: 400px;
        }

        .money-grid {
            display: grid;
            grid-template-columns: repeat(2, 325px);
            grid-gap: 8px 10px;
            grid-auto-flow: column;
            grid-template-rows: repeat(6, 60px);
            width: 100%;
            height: 100%;
        }

        .money-box {
            background-color: #ffd700;
            background-image: url('YellowStrap.png');
            background-size: 100% 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 26px;
            border-radius: 6px;
        }

        .money-box.selected {
            background-color: #ff9900;
            background-image: url('ChooseStrap.png') !important;
        }

        .money-box.closed {
            background-color: #444;
            background-image: url('CloseStrap.png') !important;
            color: transparent !important;
        }

        .game-board.hide-money #moneyGrid {
            display: none !important;
        }

        .topic-container {
            display: none;
            background-color: #ffd700;
            background-image: url('YellowStrap.png');
            background-size: 100% 100%;
            width: 660px;
            height: 65px;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            transform: scaleX(0);
            transform-origin: center;
            border-radius: 6px;
        }

        .topic-text {
            color: #000;
            font-size: 28px;
            opacity: 0;
        }

        .choices-column {
            display: none;
            flex-direction: column;
            gap: 12px;
            position: absolute;
            top: 77px;
            left: 0;
            z-index: 10;
        }

        .choice-box {
            background-color: #fff;
            background-image: url('sss.png');
            background-size: 100% 100%;
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scaleX(0);
            transform-origin: center;
            border-radius: 6px;
        }

        .choice-box.used {
            background-color: #888;
            background-image: url('bbb.png') !important;
        }

        .choice-text {
            color: #000;
            font-size: 44px;
            opacity: 0;
        }

        .game-board.show-topic .topic-container {
            display: flex;
            animation: stretchAcross 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .game-board.show-topic .topic-text {
            animation: fadeInText 0.2s ease-in-out 0.3s forwards;
        }

        .game-board.show-choices .choices-column {
            display: flex;
        }

        .game-board.show-choices .choice-box {
            animation: stretchAcross 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .game-board.show-choices .choice-text {
            animation: fadeInText 0.2s ease-in-out forwards;
        }

        .game-board.show-choices #choiceA {
            animation-delay: 0s;
        }

        .game-board.show-choices #choiceB {
            animation-delay: 0.25s;
        }

        .game-board.show-choices #choiceC {
            animation-delay: 0.5s;
        }

        .game-board.show-choices #choiceA .choice-text {
            animation-delay: 0.3s;
        }

        .game-board.show-choices #choiceB .choice-text {
            animation-delay: 0.55s;
        }

        .game-board.show-choices #choiceC .choice-text {
            animation-delay: 0.8s;
        }

        .question-area {
            display: none;
            position: absolute;
            top: 77px;
            left: 85px;
            width: 575px;
            height: 249px;
        }

        .question-box {
            width: 100%;
            height: 100%;
            background-color: #fff;
            background-size: 100% 100%;
            display: flex;
            align-items: center;
            padding: 20px 145px 20px 30px;
            box-sizing: border-box;
            transform: scaleX(0);
            transform-origin: left center;
            border-radius: 8px;
        }

        .game-board.round-2-mode .question-box {
            padding: 20px 30px !important;
        }

        .question-content {
            color: #000;
            font-size: 22px;
            line-height: 1.4;
            opacity: 0;
        }

        .answer-buttons {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
        }

        .game-board.round-2-mode .answer-buttons {
            display: none !important;
        }

        .ans-btn {
            background-color: #ffd700;
            background-image: url('sss.png');
            background-size: 100% 100%;
            width: 100px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 24px;
            border-radius: 6px;
        }

        .ans-btn.chosen {
            background-color: #2196f3;
            background-image: url('true false choose strap.png') !important;
            color: #fff !important;
        }

        .ans-btn.correct-final {
            background-color: #4caf50;
            background-image: url('truefalseright strap.png') !important;
            color: #fff !important;
        }

        .ans-btn.wrong-final {
            background-color: #f44336;
            background-image: url('truefalsewrongstrap.png') !important;
            color: #fff !important;
        }

        .ans-btn.hidden-ans {
            opacity: 0 !important;
        }

        .game-board.show-question .question-area {
            display: block;
        }

        .game-board.show-question .question-box {
            animation: stretchAcross 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .game-board.show-question .question-content {
            animation: fadeInText 0.3s ease-in-out 0.4s forwards;
        }

        .game-board.show-question .answer-buttons {
            animation: fadeInText 0.3s ease-in-out 0.7s forwards;
        }

        .round2-answer-container {
            display: none;
            position: absolute;
            top: 159px;
            width: 660px;
            height: 98px;
        }

        .round2-answer-box {
            width: 100%;
            height: 100%;
            background-color: #fff;
            background-size: 100% 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scaleX(0);
            transform-origin: center;
            border-radius: 8px;
        }

        .round2-answer-text {
            color: #000;
            font-size: 32px;
            text-align: center;
            opacity: 0;
            text-transform: uppercase;
        }

        .game-board.round-2-mode.show-r2-ans .question-area {
            display: block;
        }

        .game-board.round-2-mode.show-r2-ans .question-box {
            animation: shrinkLeft 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .game-board.round-2-mode.show-r2-ans .question-content {
            opacity: 0;
            transition: opacity 0.1s;
        }

        .game-board.round-2-mode.show-r2-ans .choices-column {
            display: none !important;
        }

        .game-board.round-2-mode.show-r2-ans .round2-answer-container {
            display: block;
        }

        .game-board.round-2-mode.show-r2-ans .round2-answer-box {
            animation: stretchFromCenter 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.3s forwards;
        }

        .game-board.round-2-mode.show-r2-ans .round2-answer-text {
            animation: fadeInText 0.15s ease-in-out 0.6s forwards;
        }

        .game-board.round-2-mode.play-close .question-area {
            display: none;
        }

        .game-board.round-2-mode.play-close .round2-answer-container {
            display: block;
        }

        .game-board.round-2-mode.play-close .round2-answer-box {
            animation: shrinkToCenter 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
        }

        .game-board.round-2-mode.play-close .round2-answer-text {
            opacity: 0 !important;
        }

        .game-board.round-2-mode.show-r2-result .question-area {
            display: none;
        }

        .game-board.round-2-mode.show-r2-result .choices-column {
            display: none !important;
        }

        .game-board.round-2-mode.show-r2-result .round2-answer-container {
            display: block;
        }

        .game-board.round-2-mode.show-r2-result .round2-answer-box {
            animation: stretchFromCenter 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .game-board.round-2-mode.show-r2-result .round2-answer-text {
            animation: fadeInText 0.15s ease-in-out 0.3s forwards;
        }

        .mhc-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            background-image: url('MHC.png');
            background-size: cover;
            background-position: center;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .money-box-animate {
            opacity: 0;
            animation: fadeInUpMoney 0.1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .money-text-inner {
            display: inline-block;
            transform-origin: center center;
            will-change: transform;
        }

        .money-text-inner[data-anim="active"] {
            animation: moneyCloseOpenInner 0.6s linear forwards;
        }

        @keyframes moneyCloseOpenInner {
            0% {
                transform: scaleX(1);
            }

            50% {
                transform: scaleX(0);
            }

            100% {
                transform: scaleX(1);
            }
        }

        @keyframes signSlideLeft {
            0% {
                transform: translateX(100px) scale(0.5);
                opacity: 0;
            }

            100% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes signSlideRight {
            0% {
                transform: translateX(-100px) scale(0.5);
                opacity: 0;
            }

            100% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes stretchAcross {
            0% {
                transform: scaleX(0);
            }

            100% {
                transform: scaleX(1);
            }
        }

        @keyframes fadeInText {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes shrinkLeft {
            0% {
                transform: scaleX(1);
                opacity: 1;
            }

            100% {
                transform: scaleX(0);
                opacity: 0;
            }
        }

        @keyframes stretchFromCenter {
            0% {
                transform: scaleX(0);
            }

            100% {
                transform: scaleX(1);
            }
        }

        @keyframes shrinkToCenter {
            0% {
                transform: scaleX(1);
            }

            100% {
                transform: scaleX(0);
            }
        }

        @keyframes fadeInUpMoney {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes stretch460 {
            0% {
                transform: scaleX(0);
            }

            100% {
                transform: scaleX(1);
            }
        }

        @keyframes stretch660 {
            0% {
                transform: scaleX(0);
            }

            100% {
                transform: scaleX(1);
            }
        }
    </style>
</head>

<body>
    <div id="mhcOverlay" class="mhc-overlay"></div>
    <div class="game-board hide-money" id="gameBoard">
        <div class="prize-container" id="prizeContainer">
            <img src="daucong.png" id="leftSignImg" class="sign-img" alt="+">
            <div class="main-prize" id="totalPrize">0 $A</div>
            <img src="daucong.png" id="rightSignImg" class="sign-img" alt="+">
        </div>
        <div class="symbols-row" id="symbolsRow"></div>

        <div class="bottom-area">
            <div class="money-grid" id="moneyGrid"></div>
            <div class="topic-container" id="topicContainer">
                <div class="topic-text" id="topicText">TỪ CHỦ ĐỀ 1</div>
            </div>
            <div class="choices-column" id="choicesColumn">
                <div class="choice-box" id="choiceA">
                    <div class="choice-text">A</div>
                </div>
                <div class="choice-box" id="choiceB">
                    <div class="choice-text">B</div>
                </div>
                <div class="choice-box" id="choiceC">
                    <div class="choice-text">C</div>
                </div>
            </div>
            <div class="question-area" id="questionArea">
                <div class="question-box" id="questionBox">
                    <div class="question-content" id="questionContent">Nội dung câu hỏi...</div>
                </div>
                <div class="answer-buttons" id="answerButtons">
                    <div class="ans-btn" id="trueBtn">ĐÚNG</div>
                    <div class="ans-btn" id="falseBtn">SAI</div>
                </div>
            </div>
            <div class="round2-answer-container" id="round2AnswerContainer">
                <div class="round2-answer-box" id="round2AnswerBox">
                    <div class="round2-answer-text" id="round2AnswerText">ĐÁP ÁN</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = (typeof io !== 'undefined') ? io() : null;

        if (socket) {
            socket.on('connect', () => {
                socket.emit('register-role', { role: 'screen' });
            });
            socket.emit('register-role', { role: 'screen' });
        }

        let audioUnlocked = false;
        function unlockAudio() {
            if (audioUnlocked) return;
            const dummy = new Audio();
            dummy.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
            dummy.play().then(() => {
                audioUnlocked = true;
                document.removeEventListener('click', unlockAudio);
                document.removeEventListener('keydown', unlockAudio);
            }).catch(() => { });
        }
        document.addEventListener('click', unlockAudio);
        document.addEventListener('keydown', unlockAudio);

        const SHORT_SOUNDS = ['reveal_amount.mp3', 'round_start.mp3', 'theme_short.mp3', 'ding.mp3', 'value_increase.mp3', 'value_decrease.mp3'];
        const audioCache = {};
        let currentBackgroundMusic = null;

        SHORT_SOUNDS.forEach(soundName => {
            const audio = new Audio(soundName);
            audio.preload = 'auto';
            audioCache[soundName] = audio;
        });

        if (socket) {
            socket.on('play-sound-client', (data) => {
                if (!data || !data.sound) return;
                const soundName = data.sound;
                if (audioCache[soundName]) {
                    const cloneSound = audioCache[soundName].cloneNode();
                    cloneSound.volume = 1;
                    cloneSound.play().catch(err => { });
                } else {
                    if (currentBackgroundMusic) currentBackgroundMusic.pause();
                    currentBackgroundMusic = new Audio(soundName);
                    currentBackgroundMusic.play().catch(err => { });
                }
            });

            socket.on('stop-all-sounds-client', () => {
                if (currentBackgroundMusic) {
                    currentBackgroundMusic.pause();
                    currentBackgroundMusic.currentTime = 0;
                }
                SHORT_SOUNDS.forEach(soundName => {
                    if (audioCache[soundName]) {
                        audioCache[soundName].pause();
                        audioCache[soundName].currentTime = 0;
                    }
                });
            });
        }

        let wasHiddenBefore = true;
        let activeDingIndexes = new Set();
        let currentRenderSession = 0;
        let isAnimatingMoney = false;

        if (socket) {
            socket.on('sync-full-state', (state) => {
                if (!state) return;

                // 1. MHC Overlay
                const mhc = document.getElementById('mhcOverlay');
                if (mhc) mhc.style.display = (state.showMHC === undefined || state.showMHC === true) ? 'flex' : 'none';

                // 2. Class Board
                const board = document.getElementById('gameBoard');
                board.className = "game-board";
                if (state.currentActiveRound === 2) board.classList.add('round-2-mode');
                if (state.displayClasses) state.displayClasses.forEach(cls => board.classList.add(cls));

                // 3. Side signs
                const container = document.getElementById('prizeContainer');
                const leftImg = document.getElementById('leftSignImg');
                const rightImg = document.getElementById('rightSignImg');

                if (state.activeSideSign) {
                    leftImg.src = state.activeSideSign;
                    rightImg.src = state.activeSideSign;
                    container.classList.add('has-signs');
                } else {
                    container.classList.remove('has-signs');
                }

                // 4. Money Animation on Shape
                let mainPrizeBox = document.querySelector('.main-prize');
                let totalPrizeEl = document.getElementById('totalPrize');
                const hasAnimationTrigger = (state.lastAction === 'moneyAnim_increase' || state.lastAction === 'moneyAnim_decrease');

                if (hasAnimationTrigger && !isAnimatingMoney) {
                    isAnimatingMoney = true;
                    const currentAnimType = state.lastAction;

                    socket.emit('consume-action');

                    const soundName = currentAnimType === 'moneyAnim_increase' ? 'value_increase.mp3' : 'value_decrease.mp3';
                    if (audioCache[soundName]) {
                        const cloneSound = audioCache[soundName].cloneNode();
                        cloneSound.volume = 1;
                        cloneSound.play().catch(e => { });
                    }

                    mainPrizeBox.style.animation = 'none';
                    mainPrizeBox.offsetHeight;
                    mainPrizeBox.style.animation = 'moneyCloseOpen 0.6s linear forwards';

                    setTimeout(() => {
                        if (totalPrizeEl && typeof state.globalTotalPrize === 'number') {
                            totalPrizeEl.innerText = state.globalTotalPrize.toLocaleString('vi-VN') + " $A";
                        }
                    }, 300);

                    setTimeout(() => {
                        mainPrizeBox.style.animation = '';
                        isAnimatingMoney = false;
                    }, 600);

                } else {
                    if (!isAnimatingMoney && totalPrizeEl && typeof state.globalTotalPrize === 'number') {
                        totalPrizeEl.innerText = state.globalTotalPrize.toLocaleString('vi-VN') + " $A";
                    }
                }

                // 5. Grid logic animation
                const isCurrentlyHidden = state.displayClasses && state.displayClasses.includes('hide-money');
                let shouldAnimateGrid = false;

                if (wasHiddenBefore && !isCurrentlyHidden) {
                    shouldAnimateGrid = true;
                    activeDingIndexes.clear();
                    currentRenderSession++;
                }
                wasHiddenBefore = isCurrentlyHidden;

                // 6. Draw Grid
                const grid = document.getElementById('moneyGrid');
                grid.innerHTML = '';
                const layout = state.currentActiveRound === 1 ? state.currentMoneyLayoutV1 : state.currentMoneyLayoutV2;
                const currentGridState = state.currentActiveRound === 1 ? state.moneyGridStateV1 : state.moneyGridStateV2;
                const thisSession = currentRenderSession;

                if (Array.isArray(layout)) {
                    layout.forEach((val, idx) => {
                        const box = document.createElement('div');
                        box.className = 'money-box';
                        box.innerText = val;
                        if (currentGridState && currentGridState[idx] === 'selected') box.classList.add('selected');
                        if (currentGridState && currentGridState[idx] === 'closed') box.classList.add('closed');

                        if (shouldAnimateGrid) {
                            box.classList.add('money-box-animate');
                            box.style.animationDelay = `${idx * 0.12}s`;

                            box.addEventListener('animationstart', () => {
                                if (thisSession === currentRenderSession && !activeDingIndexes.has(idx)) {
                                    activeDingIndexes.add(idx);
                                    if (audioCache['ding.mp3']) {
                                        const cloneDing = audioCache['ding.mp3'].cloneNode();
                                        cloneDing.volume = 1;
                                        cloneDing.play().catch(e => { });
                                    }
                                }
                            });
                        }
                        grid.appendChild(box);
                    });
                }

                // 7. Symbols Row
                const sRow = document.getElementById('symbolsRow');
                sRow.innerHTML = '';
                const displaySigns = state.currentActiveRound === 1 ? ['+', '+', '+', '+', '-', '-', '-', '-'] : ['×', '×', '×', '×', '÷', '÷', '÷', '÷'];
                const currentSymbolState = state.currentActiveRound === 1 ? state.symbolBoxesStateV1 : state.symbolBoxesStateV2;

                displaySigns.forEach((sign, idx) => {
                    const box = document.createElement('div');
                    box.className = 'symbol-box';
                    box.innerHTML = `<span>${sign}</span>`;
                    if (currentSymbolState && currentSymbolState[idx] === 'selected') box.classList.add('selected');
                    if (currentSymbolState && currentSymbolState[idx] === 'closed') box.classList.add('closed');
                    sRow.appendChild(box);
                });

                // 8. Texts & Topics
                if (state.currentRoundData && state.currentRoundData.topic) {
                    document.getElementById('topicText').innerText = state.currentRoundData.topic;
                } else {
                    document.getElementById('topicText').innerText = '';
                }

                ['A', 'B', 'C'].forEach(ch => {
                    const cBox = document.getElementById(`choice${ch}`);
                    if (cBox) {
                        if (state.usedChoices && state.usedChoices[ch]) cBox.classList.add('used');
                        else cBox.classList.remove('used');
                    }
                });

                if (state.activeQuestion && state.currentRoundData && state.currentRoundData[state.activeQuestion]) {
                    const qData = state.currentRoundData[state.activeQuestion];
                    document.getElementById('questionContent').innerText = qData.text || '';
                    document.getElementById('questionBox').style.backgroundImage = `url('box${state.activeQuestion}.png')`;
                    if (state.round1CtrlState) {
                        document.getElementById('trueBtn').className = state.round1CtrlState.trueBtnClass || 'ans-btn';
                        document.getElementById('falseBtn').className = state.round1CtrlState.falseBtnClass || 'ans-btn';
                    }
                } else {
                    document.getElementById('questionContent').innerText = '';
                }

                const r2Box = document.getElementById('round2AnswerBox');
                const r2Txt = document.getElementById('round2AnswerText');
                if (r2Box && r2Txt && state.round2CtrlState) {
                    r2Box.style.backgroundImage = state.round2CtrlState.backgroundImage || "url('Whitebar2.png')";
                    r2Txt.innerText = state.round2CtrlState.text || '';
                    r2Txt.style.color = state.round2CtrlState.textColor || '#000000';
                }
            });
        }

        function disableDevTools() {
            document.addEventListener('contextmenu', (e) => e.preventDefault());

            document.addEventListener('keydown', (e) => {
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                    (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
                ) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            });

            setInterval(() => {
                console.clear();
            }, 1000);
        }

        window.addEventListener('DOMContentLoaded', disableDevTools);
    </script>
</body>

</html>
